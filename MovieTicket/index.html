<!-- CADPO -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket </title> <!-- Titulo de la pagina -->
    <link rel="stylesheet" href="estilos.css"> <!-- Enlace del CSS -->
    <link rel="shortcut icon" href="boleto.png" type="image/x-icon">
</head>
<body>
    <!-- Contenedor principl del boleto -->
     <div class="ticket">
        <!-- Parte superior del boleto -->
         <div class="top">
            <h2>Cinema</h2>
            <!-- Subtitulo de la pelicula -->
            <div class="movie-title">CS Film</div>
         </div>
         <!-- Parte inferior del boleto -->
          <div class="bottom">
            <div class="info">
                <div>DATE</div>
                <span>SEP 28</span>
            </div>
            <!-- Informacion de la hora -->
             <div class="info" style="text-align: center;"></div>
             <div>Time</div>
             <span>20:00</span>
          </div>
          <!-- Informacion del asiento -->
           <div class="info" style="text-align: right;">
            <div>SEAT</div>
            <span>A12</span>
           </div>
     </div>
</body>
</html>
