<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Login</title> <!-- Titulo de la pagina -->
    <link rel="stylesheet" href="estilos.css">  <!-- Enlace del css -->
    <link rel="shortcut icon" href="perfil-del-usuario.png" type="image/x-icon">
</head>
<body>
    <!-- Contenedor principal del formulario -->
    <div class="card">
        <h2>Login</h2>
        <form>
            <input type="text"
                   placeholder="Username"
                   required>
            <input type="password"
                   placeholder="Password"
                   required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
