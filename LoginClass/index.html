<!-- CADPO  -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
    initial-scale=1.0">
    <title>Glass Login</title><!-- Título de la página -->
    <link rel="stylesheet" href="estilos.css"><!-- Enlace del CSS -->
    <link rel="shortcut icon" href="perfil-del-usuario.png" type="image/x-icon">
</head>
<body>
    <div class="glass-card">
        <!-- Título de bienvenida -->
        <h2>Welcome</h2>
        <!-- Inicio del formulario -->
        <form>
            <!-- Campo de correo electrónico -->
            <input type="text" placeholder="Email" required>
            <!-- Campo de contraseña -->
            <input type="password" placeholder="Password" required>
            <!-- Botón de envío -->
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
